<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EURO 2026 Packing App V4</title>
<style>
:root{--blue:#075fae;--bg:#f4f6f8;--card:#fff;--text:#17202a;--line:#dce2e7} body.dark{--bg:#111827;--card:#1f2937;--text:#f3f4f6;--line:#374151}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:5;background:var(--blue);color:white;padding:12px 14px;box-shadow:0 2px 8px #0003}h1{font-size:20px;margin:0 0 5px}progress{width:100%;height:15px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}input[type=search],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}.toggle{display:flex;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap}main{max-width:760px;margin:auto;padding:10px}section{background:var(--card);border-radius:13px;margin-bottom:11px;padding:12px;box-shadow:0 1px 4px #0001}h2{font-size:18px;margin:0 0 6px}.item{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input{width:22px;height:22px}.name{font-weight:650}.assignment{margin-top:5px;font-size:13px}.assignment select{padding:7px;font-size:13px}.hidden{display:none}.actions{display:flex;flex-wrap:wrap;gap:8px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:650;background:#4b5563;color:white}button.green{background:#217a3c}button.red{background:#b42318}.empty{padding:18px;text-align:center;color:#6b7280}
@media(max-width:520px){.filters{grid-template-columns:1fr}}
</style></head><body>
<header><h1>EURO 2026 Packing</h1><div id="overall"></div><progress id="progress" max="100" value="0"></progress>
<div class="filters"><input id="search" type="search" placeholder="Search items or bags"><select id="bagFilter"><option value="">All packing locations</option></select></div>
<div class="toggle"><label><input id="unpacked" type="checkbox"> Unpacked only</label><button id="dark">Dark mode</button></div></header>
<main><div id="sections"></div><section><div class="actions"><button class="green" id="packVisible">Pack visible</button><button class="red" id="unpackVisible">Unpack visible</button><button id="exportBtn">Export progress</button></div></section></main>
<script>
const items=[{"section": "Clothing", "name": "Brown leather jacket", "assignment": "Wear in transit"}, {"section": "Clothing", "name": "Bright-red waterproof jacket", "assignment": "Outerwear cube"}, {"section": "Clothing", "name": "Navy sweaters (2)", "assignment": "Cube 1: Tops & layers"}, {"section": "Clothing", "name": "Black 1/4-zip", "assignment": "Cube 1: Tops & layers"}, {"section": "Clothing", "name": "Olive merino 1/4-zip", "assignment": "Wear in transit"}, {"section": "Clothing", "name": "Long-sleeve tops (3)", "assignment": "Cube 1: Tops & layers"}, {"section": "Clothing", "name": "Dri-FIT T-shirts (3)", "assignment": "Cube 1: Tops & layers"}, {"section": "Clothing", "name": "Button-down shirts (2)", "assignment": "Folder: Shirts"}, {"section": "Clothing", "name": "Khaki/dark pants (3)", "assignment": "Cube 2: Bottoms"}, {"section": "Clothing", "name": "Underwear (12)", "assignment": "Cube 3: Underwear"}, {"section": "Clothing", "name": "Wool socks (12)", "assignment": "Cube 3: Underwear"}, {"section": "Clothing", "name": "Sleep shorts", "assignment": "Cube 3: Underwear"}, {"section": "Clothing", "name": "Blue Adidas Dove Allstars", "assignment": "Wear in transit"}, {"section": "Clothing", "name": "Brown desert boots", "assignment": "Shoe bag"}, {"section": "Clothing", "name": "Rutgers scarf", "assignment": "Personal item"}, {"section": "Clothing", "name": "Navy beanie", "assignment": "Personal item"}, {"section": "Clothing", "name": "Sunglasses", "assignment": "Personal item"}, {"section": "Clothing", "name": "Brown belt", "assignment": "Wear in transit"}, {"section": "Travel Essentials", "name": "Passport", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Passport copies", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Flight confirmations", "assignment": "Phone / digital"}, {"section": "Travel Essentials", "name": "Travel insurance", "assignment": "Phone / digital"}, {"section": "Travel Essentials", "name": "Primary credit card", "assignment": "Wallet"}, {"section": "Travel Essentials", "name": "Backup payment card", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "GBP/EUR cash", "assignment": "Wallet"}, {"section": "Travel Essentials", "name": "Driver license", "assignment": "Wallet"}, {"section": "Travel Essentials", "name": "Prescription medications", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Medication list", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Pain reliever", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Bandages / blister care", "assignment": "Day bag"}, {"section": "Travel Essentials", "name": "Hand sanitizer", "assignment": "Day bag"}, {"section": "Travel Essentials", "name": "Travel tissues", "assignment": "Day bag"}, {"section": "Travel Essentials", "name": "Toothbrush, toothpaste and floss", "assignment": "Toiletry bag"}, {"section": "Travel Essentials", "name": "Deodorant", "assignment": "Toiletry bag"}, {"section": "Travel Essentials", "name": "Shampoo / body wash", "assignment": "Liquids bag"}, {"section": "Travel Essentials", "name": "Razor and grooming items", "assignment": "Toiletry bag"}, {"section": "Travel Essentials", "name": "Moisturizer and lip balm", "assignment": "Liquids bag"}, {"section": "Travel Essentials", "name": "Sunscreen", "assignment": "Liquids bag"}, {"section": "Travel Essentials", "name": "Phone", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Phone charging cable", "assignment": "Tech pouch"}, {"section": "Travel Essentials", "name": "Compact power bank", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "UK Type G adapter", "assignment": "Tech pouch"}, {"section": "Travel Essentials", "name": "EU Type C adapter", "assignment": "Tech pouch"}, {"section": "Travel Essentials", "name": "Earbuds / headphones", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "eSIM / roaming plan", "assignment": "Phone / digital"}, {"section": "Travel Essentials", "name": "Compact day bag", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Reusable water bottle", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Compact umbrella", "assignment": "Carry-on loose"}, {"section": "Travel Essentials", "name": "Pen", "assignment": "Personal item"}, {"section": "Travel Essentials", "name": "Luggage tag and contact card", "assignment": "Carry-on loose"}];
const defaultAssignments=[...new Set(items.map(x=>x.assignment))].sort();
const key=i=>`euro2026-item-${i}`; const assignmentKey=i=>`euro2026-assignment-${i}`;
function currentAssignment(i){return localStorage.getItem(assignmentKey(i))||items[i].assignment}
function buildBagFilter(){const current=bagFilter.value; const values=[...new Set(items.map((x,i)=>currentAssignment(i)))].sort(); bagFilter.innerHTML='<option value="">All packing locations</option>'+values.map(v=>`<option>${v}</option>`).join(''); bagFilter.value=values.includes(current)?current:''}
function render(){sections.innerHTML=''; ['Clothing','Travel Essentials'].forEach(section=>{const indices=items.map((x,i)=>x.section===section?i:-1).filter(i=>i>=0); const el=document.createElement('section'); el.innerHTML=`<h2>${section} <span id="stat-${section.replace(/ /g,'')}"></span></h2><div class="rows"></div>`; const rows=el.querySelector('.rows'); indices.forEach(i=>{const x=items[i], row=document.createElement('div'); row.className='item'; row.dataset.index=i; row.innerHTML=`<input class="check" type="checkbox" ${localStorage.getItem(key(i))==='1'?'checked':''}><div><div class="name">${x.name}</div><div class="assignment"><select class="assignmentSelect">${defaultAssignments.map(a=>`<option ${a===currentAssignment(i)?'selected':''}>${a}</option>`).join('')}</select></div></div>`; rows.appendChild(row)}); sections.appendChild(el)}); update()}
function update(){document.querySelectorAll('.item').forEach(row=>{const i=+row.dataset.index; localStorage.setItem(key(i),row.querySelector('.check').checked?'1':'0')}); const checks=[...document.querySelectorAll('.check')], done=checks.filter(x=>x.checked).length; overall.textContent=`${done} / ${checks.length} packed`; progress.value=checks.length?100*done/checks.length:0; ['Clothing','Travel Essentials'].forEach(s=>{const ids=items.map((x,i)=>x.section===s?i:-1).filter(i=>i>=0), d=ids.filter(i=>localStorage.getItem(key(i))==='1').length; document.getElementById('stat-'+s.replace(/ /g,'')).textContent=`(${d}/${ids.length})`}); filter()}
function filter(){const q=search.value.trim().toLowerCase(), bag=bagFilter.value, only=unpacked.checked; document.querySelectorAll('.item').forEach(row=>{const i=+row.dataset.index, text=(items[i].name+' '+currentAssignment(i)).toLowerCase(), checked=row.querySelector('.check').checked; row.classList.toggle('hidden',!(text.includes(q)&&(!bag||currentAssignment(i)===bag)&&(!only||!checked)))}); document.querySelectorAll('section').forEach(s=>{const rows=[...s.querySelectorAll('.item')]; if(rows.length)s.classList.toggle('hidden',rows.every(r=>r.classList.contains('hidden')))})}
document.addEventListener('change',e=>{if(e.target.classList.contains('check')) update(); if(e.target.classList.contains('assignmentSelect')){const row=e.target.closest('.item'),i=+row.dataset.index; localStorage.setItem(assignmentKey(i),e.target.value); buildBagFilter(); filter()} if(e.target===unpacked||e.target===bagFilter)filter()}); search.addEventListener('input',filter);
dark.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'))};
packVisible.onclick=()=>{document.querySelectorAll('.item:not(.hidden) .check').forEach(x=>x.checked=true);update()};unpackVisible.onclick=()=>{document.querySelectorAll('.item:not(.hidden) .check').forEach(x=>x.checked=false);update()};
document.getElementById('exportBtn').onclick=()=>{const out=items.map((x,i)=>({...x,assignment:currentAssignment(i),packed:localStorage.getItem(key(i))==='1'}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='EURO-2026-packing-progress.json';a.click();URL.revokeObjectURL(a.href)};
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark'); buildBagFilter(); render();
</script></body></html>
